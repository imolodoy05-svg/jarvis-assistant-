<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020912">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JARVIS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>J.A.R.V.I.S.</title>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">STARK INDUSTRIES · PERSONAL SYSTEM</div>
      <h1>J.A.R.V.I.S.</h1>
      <div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
    </header>

    <section class="core-wrap" aria-label="Голографический интерфейс">
      <div class="ring ring-a"></div><div class="ring ring-b"></div>
      <div class="ring ring-c"></div>
      <div class="core"><span>J</span></div>
      <div class="orbit-dot"></div>
    </section>

    <div id="status" class="status">СИСТЕМА ГОТОВА</div>
    <section id="log" class="log" aria-live="polite">
      <p class="assistant">Добрый вечер, сэр. Система готова к работе.</p>
    </section>

    <section class="controls">
      <button id="mic" class="mic" aria-label="Голосовой ввод">🎙</button>
      <div class="hint" id="hint">НАЖМИТЕ МИКРОФОН И ГОВОРИТЕ</div>
      <form id="chat-form">
        <input id="message" autocomplete="off" placeholder="Введите команду..." maxlength="2000">
        <button type="submit" class="send">➤</button>
      </form>
      <div class="bottom">
        <button id="voice-toggle" class="small">ГОЛОС: ВКЛ.</button>
        <button id="clear" class="small">ОЧИСТИТЬ ДИАЛОГ</button>
      </div>
    </section>
    <footer>PERSONAL AI · V1.0 · ONLINE CONNECTION REQUIRED</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
